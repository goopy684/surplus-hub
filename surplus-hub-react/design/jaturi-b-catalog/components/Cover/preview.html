<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;800&display=swap">
<style>
body{margin:0;background:var(--paper);font-family:var(--font-sans)}
.cv{position:relative;width:960px;height:288px;overflow:hidden;background:var(--paper)}
.tx{position:absolute;left:40px;bottom:36px;max-width:440px}
h1{margin:0;font-size:72px;line-height:.95;font-weight:800;letter-spacing:-2px;color:var(--ink)}
p{margin:14px 0 0;font-size:14px;font-weight:500;color:var(--ink-2)}
svg{position:absolute;left:480px;top:0}
.primary{fill:var(--primary)}.ink{fill:var(--ink)}.soft{fill:var(--accent-soft)}.field{fill:var(--field)}.olive{fill:var(--olive-tx)}.paper{fill:var(--paper)}
</style>
<div class="cv">
<!-- derivation
blocks: primary 240×288 slab (bleeds top+bottom) · ink 160×136 · accent-soft 160×136 · field 80×288 strip · olive disc 56 — primary/ink lead because cobalt+ink is how the app reads
arrangement: one tall slab with satellites, flush modular grid at space-6 (24) multiples, right edge bleeds
pattern: pills and discs from radius-chip (9999px = half short side) — "둥글되 장식 없이: 필 칩, 원형 버튼" in the README
steps & radii: space-3 12 gaps between pills, space-6 24 grid, chip-h 38 pill height, touch-min 44 discs, radius-card 16 on satellites
-->
<svg width="480" height="288" viewBox="0 0 480 288" aria-hidden="true">
  <rect class="field" x="400" y="0" width="80" height="288"/>
  <rect class="primary" x="0" y="0" width="240" height="288"/>
  <rect class="ink" x="240" y="0" width="160" height="136" rx="0"/>
  <rect class="soft" x="240" y="152" width="160" height="136" rx="16"/>
  <rect class="paper" x="24" y="40" width="120" height="38" rx="19"/>
  <rect class="paper" x="24" y="90" width="168" height="38" rx="19" opacity=".35"/>
  <rect class="paper" x="24" y="140" width="96" height="38" rx="19" opacity=".35"/>
  <circle class="paper" cx="196" cy="232" r="22"/>
  <circle class="primary" cx="320" cy="220" r="22"/>
  <rect class="primary" x="264" y="176" width="72" height="16" rx="8" opacity=".5"/>
  <circle class="olive" cx="440" cy="68" r="22"/>
  <rect class="primary" x="412" y="200" width="56" height="38" rx="19"/>
  <rect class="paper" x="264" y="48" width="112" height="38" rx="19" opacity=".2"/>
</svg>
<div class="tx"><h1>자투리<br>B 카탈로그</h1><p>매물이 먼저 보이는 밝은 카탈로그. 화이트, 쿨 잉크, 코발트 하나.</p></div>
</div>
