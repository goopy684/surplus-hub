<style>body{margin:0;font-family:var(--font-sans);color:var(--ink);background:var(--paper)} .num{font-family:var(--font-num);font-variant-numeric:tabular-nums} .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:20px}button{font-family:inherit;cursor:pointer;border:0}.p{height:52px;padding:0 24px;border-radius:var(--radius-btn);background:var(--primary);color:var(--primary-foreground);font-size:15.5px;font-weight:700}.p:hover{background:var(--primary-dark)}.s{height:48px;padding:0 20px;border-radius:var(--radius-btn);background:var(--field);color:var(--ink);font-size:14px;font-weight:600}.o{height:48px;padding:0 20px;border-radius:var(--radius-btn);background:var(--surface);border:1px solid var(--line);color:var(--ink);font-size:14px;font-weight:600}.i{width:44px;height:44px;border-radius:9999px;background:var(--field);color:var(--ink);display:flex;align-items:center;justify-content:center}.fab{height:52px;padding:0 20px;border-radius:9999px;background:var(--primary);color:var(--primary-foreground);font-weight:700;font-size:15px;display:flex;gap:6px;align-items:center;box-shadow:var(--shadow-fab)}.p[disabled]{opacity:.5;cursor:not-allowed}</style>
