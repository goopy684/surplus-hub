name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # ---- surplus-hub-api-v3 ----
  api-lint-and-type-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: surplus-hub-api-v3
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Check imports
        run: |
          python -c "from app.main import app; print('Import check passed')"

  api-test:
    runs-on: ubuntu-latest
    needs: api-lint-and-type-check
    defaults:
      run:
        working-directory: surplus-hub-api-v3
    services:
      postgres:
        # pgvector image: the app's migrations CREATE EXTENSION vector, which
        # plain postgres:15 does not ship, so `alembic upgrade head` would fail.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: surplushub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost/surplushub_test
      SECRET_KEY: test-secret-key
      POSTGRES_SERVER: localhost
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: surplushub_test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run migrations
        run: alembic upgrade head
      - name: Verify DB schema matches models (no migration drift)
        run: python scripts/check_schema_drift.py
      - name: Run tests
        run: pytest app/tests/ -v --tb=short

  api-docker-build:
    runs-on: ubuntu-latest
    needs: api-test
    if: github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: surplus-hub-api-v3
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t surplus-hub-api:${{ github.sha }} .

  # ---- surplus-hub-react ----
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: surplus-hub-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint (web)
        run: npx turbo run lint --filter=web
      - name: Check types (web)
        run: npx turbo run check-types --filter=web
      - name: Test (web)
        run: npm run test --workspace=web
      - name: Build (web)
        env:
          # NOTE: client reads NEXT_PUBLIC_API_URL (not *_API_BASE_URL).
          NEXT_PUBLIC_API_URL: https://api.example.com
        run: npx turbo run build --filter=web

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: surplus-hub-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check types (mobile)
        run: npm run check-types --workspace=mobile
